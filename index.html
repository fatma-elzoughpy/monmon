<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everything is going to be fine ✨</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- Main Content Card -->

            <p>MONMON , hellllllo. everything is going to be fine :) love youu ❤️</p>

        <button class="btn" id="hugBtn">Click for a warm hug 🤍</button>
        
        <div class="hidden-msg" id="hiddenMsg">
            Sending you all the happy vibes! Always here for you ✨🌷
        </div>
    </main>

    <!-- Canvas Confetti Library & Main Script -->
